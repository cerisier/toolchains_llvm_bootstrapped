name: CI
# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [main]
  pull_request:
    branches: [main, "cerisier/windows-msvc-*"]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  workflow_call:
concurrency:
  # Cancel previous actions from the same PR or branch except 'main' branch.
  # See https://docs.github.com/en/actions/using-jobs/using-concurrency and https://docs.github.com/en/actions/learn-github-actions/contexts for more info.
  group: concurrency-group::${{ github.workflow }}::${{ github.event.pull_request.number > 0 && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}${{ github.ref_name == 'main' && format('::{0}', github.run_id) || ''}}
  cancel-in-progress: ${{ github.ref_name != 'main' }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # only test on linux for now, macos is not ready.
        os: [ubuntu-latest, ubuntu-24.04-arm]
        bazel_version: [8.x, last_rc]
        folder:
          - "e2e/rules_cc"
          - "e2e/rules_foreign_cc"
          - "e2e/rules_rust"
          - "e2e/rules_rs"
          - "e2e/cross_compilation"
          - "examples/custom_targets"
        include:
          # Path mapping requires Bazel 9+.
          - bazel_version: last_rc
            folder: "e2e/rules_cc"
            extra_flags: "--experimental_output_paths=strip"
    runs-on: ${{ matrix.os }}

    # Configure a human readable name for each job
    name: Test ${{ matrix.folder }} with Bazel ${{ matrix.bazel_version }} on ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Host-local MSVC tool protocol probes
        if: matrix.folder == 'e2e/rules_cc'
        env:
          USE_BAZEL_VERSION: ${{ matrix.bazel_version }}
        working-directory: ${{ matrix.folder }}
        shell: bash
        run: |
          bazel \
            --bazelrc=$GITHUB_WORKSPACE/.github/workflows/ci.bazelrc \
            --bazelrc=.bazelrc \
            test \
            --config=remote \
            --remote_header=x-buildbuddy-api-key=4jtaxdhxtyu4ylxdEwI7 \
            --extra_execution_platforms=@platforms//host:host \
            --spawn_strategy=local \
            --strategy=TestRunner=local \
            @llvm//tools:msvc_action_assert_test \
            @llvm//tools:msvc_artifact_assert_test \
            @llvm//tools:msvc_tool_probe_test

      # Cache build and external artifacts so that the next ci build is incremental.
      # Because github action caches cannot be updated after a build, we need to
      # store the contents of each build in a unique cache key, then fall back to loading
      # it on the next ci run. We use hashFiles(...) in the key and restore-keys- with
      # the prefix to load the most recent cache for the branch on a cache miss. You
      # should customize the contents of hashFiles to capture any bazel input sources,
      # although this doesn't need to be perfect. If none of the input sources change
      # then a cache hit will load an existing cache and bazel won't have to do any work.
      # In the case of a cache miss, you want the fallback cache to contain most of the
      # previously built artifacts to minimize build time. The more precise you are with
      # hashFiles sources the less work bazel will have to do.
      - name: Mount bazel caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel-repo
          key: bazel-cache-${{ matrix.os }}-${{ matrix.bazel_version }}-${{ matrix.folder }}-${{ hashFiles('**/BUILD.bazel', '**/*.bzl', 'MODULE.bazel') }}
          restore-keys: |
            bazel-cache-${{ matrix.os }}-${{ matrix.bazel_version }}-${{ matrix.folder }}

      - name: bazel test //...
        env:
          USE_BAZEL_VERSION: ${{ matrix.bazel_version }}
        working-directory: ${{ matrix.folder }}
        shell: bash
        run: |
          bazel \
            --bazelrc=$GITHUB_WORKSPACE/.github/workflows/ci.bazelrc \
            --bazelrc=.bazelrc \
            test \
            --remote_header=x-buildbuddy-api-key=4jtaxdhxtyu4ylxdEwI7 \
            ${{ matrix.extra_flags }} \
            //...

      - name: bazel coverage e2e (lcov)
        if: matrix.folder == 'e2e/rules_cc' && matrix.bazel_version == 'last_rc'
        env:
          USE_BAZEL_VERSION: ${{ matrix.bazel_version }}
        working-directory: ${{ matrix.folder }}
        shell: bash
        run: ./coverage_lcov_test.sh --remote_header=x-buildbuddy-api-key=4jtaxdhxtyu4ylxdEwI7

  test_windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
        bazel_version: [latest]
        folder:
          - "e2e/rules_cc"
          # - "e2e/rules_foreign_cc" TODO: Current tests only support linux
          # - "e2e/rules_rust" - Need a bazel nightly with https://github.com/bazelbuild/bazel/pull/28038
          - "e2e/cross_compilation"
    runs-on: ${{ matrix.os }}

    # Configure a human readable name for each job
    name: Test ${{ matrix.folder }} with Bazel ${{ matrix.bazel_version }} on ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Host-local MSVC tool protocol probes
        if: matrix.folder == 'e2e/rules_cc'
        env:
          USE_BAZEL_VERSION: ${{ matrix.bazel_version }}
        working-directory: ${{ matrix.folder }}
        shell: bash
        run: |
          bazel \
            --bazelrc=$GITHUB_WORKSPACE/.github/workflows/ci.bazelrc \
            --bazelrc=.bazelrc \
            test \
            --config=remote \
            --repository_cache= \
            --repo_contents_cache= \
            --remote_header=x-buildbuddy-api-key=4jtaxdhxtyu4ylxdEwI7 \
            --extra_execution_platforms=@platforms//host:host \
            --spawn_strategy=local \
            --strategy=TestRunner=local \
            @llvm//tools:msvc_action_assert_test \
            @llvm//tools:msvc_artifact_assert_test \
            @llvm//tools:msvc_tool_probe_test

      - name: bazel test //...
        id: bazel_test
        env:
          USE_BAZEL_VERSION: ${{ matrix.bazel_version }}
        working-directory: ${{ matrix.folder }}
        shell: bash
        run: |
          EXTRA_ARGS=""
          if [[ "${{ matrix.folder }}" == *"cross_compilation"* ]]; then
            EXTRA_ARGS="--//:test_glibc_versions=none"
          fi

          bazel \
            --bazelrc=$GITHUB_WORKSPACE/.github/workflows/ci.bazelrc \
            --bazelrc=.bazelrc \
            test \
            --repository_cache= \
            --repo_contents_cache= \
            --remote_header=x-buildbuddy-api-key=4jtaxdhxtyu4ylxdEwI7 \
            --jobs=100 \
            $EXTRA_ARGS \
            //...

  # macOS: smoke build (//:main_default) plus the supported sanitizer e2e tests.
  test_macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
        bazel_version: [last_rc]
        folder:
          - "e2e/rules_cc"
          # - "e2e/rules_foreign_cc" TODO: Current tests only support linux
          # - "e2e/rules_rust" - Need a bazel nightly with https://github.com/bazelbuild/bazel/pull/28038
          # - "e2e/cross_compilation"
    runs-on: ${{ matrix.os }}

    # Configure a human readable name for each job
    name: Test smoke ${{ matrix.folder }} with Bazel ${{ matrix.bazel_version }} on ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Host-local MSVC tool protocol probes
        env:
          USE_BAZEL_VERSION: ${{ matrix.bazel_version }}
        working-directory: ${{ matrix.folder }}
        shell: bash
        run: |
          bazel \
            --bazelrc=.bazelrc \
            test \
            --config=remote \
            --remote_header=x-buildbuddy-api-key=4jtaxdhxtyu4ylxdEwI7 \
            --extra_execution_platforms=@platforms//host:host \
            --spawn_strategy=local \
            --strategy=TestRunner=local \
            @llvm//tools:msvc_action_assert_test \
            @llvm//tools:msvc_artifact_assert_test \
            @llvm//tools:msvc_tool_probe_test

      - name: bazel build //:main_default
        id: bazel_test
        env:
          USE_BAZEL_VERSION: ${{ matrix.bazel_version }}
        working-directory: ${{ matrix.folder }}
        shell: bash
        run: |
          bazel \
            --bazelrc=.bazelrc \
            build \
            --remote_header=x-buildbuddy-api-key=4jtaxdhxtyu4ylxdEwI7 \
            //:main_default

      # ASan, UBSan and libFuzzer are fully supported on macOS: run their e2e
      # tests (they execute locally — no remote executor is configured for
      # macOS).
      # TSan and LSan build, link and load on macOS, but their runtime support
      # is a follow-up, so we only validate that their instrumented binaries
      # build (the runtime e2e tests stay Linux-only).
      - name: bazel test macOS sanitizers
        env:
          USE_BAZEL_VERSION: ${{ matrix.bazel_version }}
        working-directory: ${{ matrix.folder }}
        shell: bash
        run: |
          bazel \
            --bazelrc=.bazelrc \
            test \
            --remote_header=x-buildbuddy-api-key=4jtaxdhxtyu4ylxdEwI7 \
            //:asan_output_test \
            //:ubsan_output_test \
            //:fuzzer_output_test \
            //:fuzzer_asan_output_test \
            //:fuzzer_ubsan_output_test
          bazel \
            --bazelrc=.bazelrc \
            build \
            --remote_header=x-buildbuddy-api-key=4jtaxdhxtyu4ylxdEwI7 \
            //:tsan_fail \
            //:lsan_fail

      - name: bazel coverage macOS e2e (lcov)
        env:
          USE_BAZEL_VERSION: ${{ matrix.bazel_version }}
        working-directory: ${{ matrix.folder }}
        shell: bash
        run: ./coverage_lcov_test.sh --remote_header=x-buildbuddy-api-key=4jtaxdhxtyu4ylxdEwI7

  windows_msvc_layer1_hosts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bazel_version: last_rc
            target_cpu: x86_64
          - os: ubuntu-24.04-arm
            bazel_version: last_rc
            target_cpu: aarch64
          - os: macos-15-intel
            bazel_version: last_rc
            target_cpu: x86_64
          - os: macos-15
            bazel_version: last_rc
            target_cpu: aarch64
          - os: windows-latest
            bazel_version: latest
            target_cpu: x86_64
          - os: windows-11-arm
            bazel_version: latest
            target_cpu: aarch64
    runs-on: ${{ matrix.os }}
    name: Windows MSVC Layer 1 on ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Verify host-local MSVC Layer 1
        env:
          USE_BAZEL_VERSION: ${{ matrix.bazel_version }}
        working-directory: e2e/rules_cc
        shell: bash
        run: |
          cache_flags=()
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            cache_flags+=(--repository_cache= --repo_contents_cache=)
          fi

          bazel \
            --bazelrc=.bazelrc \
            test \
            "${cache_flags[@]}" \
            --remote_header=x-buildbuddy-api-key=4jtaxdhxtyu4ylxdEwI7 \
            --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 \
            --repo_env=BAZEL_WINDOWS_SDK_EULA=1 \
            --extra_execution_platforms=@platforms//host:host \
            --spawn_strategy=local \
            --strategy=TestRunner=local \
            @llvm//toolchain/features/msvc:all_tests \
            @llvm//tools:msvc_action_assert_test \
            @llvm//tools:msvc_artifact_assert_test \
            @llvm//tools:msvc_def_parser_test \
            @llvm//tools:msvc_tool_probe_test \
            //:windows_msvc_libcxx_matrix \
            //:windows_msvc_resource_directory_matrix \
            //:windows_msvc_invalid_matrix \
            //:windows_mingw_regression_matrix

      - name: Execute native Windows MSVC Layer 1
        if: runner.os == 'Windows'
        env:
          USE_BAZEL_VERSION: ${{ matrix.bazel_version }}
        working-directory: e2e/rules_cc
        shell: bash
        run: |
          bazel \
            --bazelrc=.bazelrc \
            test \
            --repository_cache= \
            --repo_contents_cache= \
            --remote_header=x-buildbuddy-api-key=4jtaxdhxtyu4ylxdEwI7 \
            --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 \
            --repo_env=BAZEL_WINDOWS_SDK_EULA=1 \
            --extra_execution_platforms=@platforms//host:host \
            --spawn_strategy=local \
            --strategy=TestRunner=local \
            //:windows_msvc_native_libcxx_matrix_${{ matrix.target_cpu }}

      - name: Verify MSVC Layer 1 action graphs
        env:
          USE_BAZEL_VERSION: ${{ matrix.bazel_version }}
        working-directory: e2e/rules_cc
        shell: bash
        run: |
          cache_flags=()
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            cache_flags+=(--repository_cache= --repo_contents_cache=)
          fi
          remote_flags=(
            --config=remote
            --remote_header=x-buildbuddy-api-key=4jtaxdhxtyu4ylxdEwI7
          )
          action_dir="${RUNNER_TEMP}/windows-msvc-actions"
          mkdir -p "${action_dir}"
          if [[ "${{ matrix.target_cpu }}" == "aarch64" ]]; then
            target_platform="@llvm//platforms:windows_aarch64_msvc"
            target_spec="${PWD}/windows_msvc_action_spec_arm64.json"
          else
            target_platform="@llvm//platforms:windows_x86_64_msvc"
            target_spec="${PWD}/windows_msvc_action_spec.json"
          fi

          bazel \
            --bazelrc=.bazelrc \
            build \
            "${cache_flags[@]}" \
            "${remote_flags[@]}" \
            --materialize_param_files \
            --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 \
            --repo_env=BAZEL_WINDOWS_SDK_EULA=1 \
            //:windows_msvc_runtime_optimization_optimized \
            //:windows_msvc_runtime_optimization_debug
          bazel \
            --bazelrc=.bazelrc \
            build \
            "${cache_flags[@]}" \
            "${remote_flags[@]}" \
            --materialize_param_files \
            --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 \
            --repo_env=BAZEL_WINDOWS_SDK_EULA=1 \
            --platforms="${target_platform}" \
            //:windows_msvc_libcxx_behavior_static \
            //:windows_msvc_libcxx_behavior_dynamic_link \
            //:windows_msvc_assembly_binary \
            //:windows_msvc_generated_def_binary
          bazel \
            --bazelrc=.bazelrc \
            build \
            "${cache_flags[@]}" \
            "${remote_flags[@]}" \
            --features=-msvc_configuration_validation \
            --features=-msvc_crt_mode_args \
            --platforms=@llvm//platforms:windows_x86_64_msvc \
            --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 \
            --repo_env=BAZEL_WINDOWS_SDK_EULA=1 \
            //:windows_msvc_crt_default_probe
          if bazel \
            --bazelrc=.bazelrc \
            build \
            "${cache_flags[@]}" \
            "${remote_flags[@]}" \
            --features=asan \
            --features=-msvc_configuration_validation \
            --platforms=@llvm//platforms:windows_x86_64_msvc \
            --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 \
            --repo_env=BAZEL_WINDOWS_SDK_EULA=1 \
            //:windows_msvc_crt_default_probe; then
            echo "mandatory MSVC configuration validation was bypassed" >&2
            exit 1
          fi
          if bazel \
            --bazelrc=.bazelrc \
            build \
            "${cache_flags[@]}" \
            "${remote_flags[@]}" \
            --platforms=@llvm//platforms:windows_x86_64_msvc \
            --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 \
            --repo_env=BAZEL_WINDOWS_SDK_EULA=1 \
            //:windows_msvc_unsupported_feature_probe; then
            echo "target-local unsupported MSVC feature was accepted" >&2
            exit 1
          fi
          if bazel \
            --bazelrc=.bazelrc \
            build \
            "${cache_flags[@]}" \
            "${remote_flags[@]}" \
            --@llvm//config:asan=true \
            --platforms=@llvm//platforms:windows_x86_64_msvc \
            --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 \
            --repo_env=BAZEL_WINDOWS_SDK_EULA=1 \
            //:windows_msvc_crt_default_probe; then
            echo "unsupported MSVC sanitizer build setting was accepted" >&2
            exit 1
          fi
          bazel \
            --bazelrc=.bazelrc \
            aquery \
            "${cache_flags[@]}" \
            "${remote_flags[@]}" \
            --include_param_files \
            --output=jsonproto \
            --output_file="${action_dir}/default.json" \
            --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 \
            --repo_env=BAZEL_WINDOWS_SDK_EULA=1 \
            --platforms="${target_platform}" \
            'deps(set(//:windows_msvc_libcxx_behavior_static //:windows_msvc_libcxx_behavior_dynamic_link //:windows_msvc_assembly_binary //:windows_msvc_generated_def_binary))'
          bazel \
            --bazelrc=.bazelrc \
            run \
            "${cache_flags[@]}" \
            "${remote_flags[@]}" \
            @llvm//tools:msvc_action_assert -- \
            -aquery "${action_dir}/default.json" \
            -param-file-root "${PWD}" \
            -spec "${target_spec}"

          for cell in mt dbg; do
            extra_flags=()
            if [[ "${cell}" == "mt" ]]; then
              extra_flags+=(--features=-dynamic_link_msvcrt --features=static_link_msvcrt)
            else
              extra_flags+=(--compilation_mode=dbg)
            fi
            bazel \
              --bazelrc=.bazelrc \
              build \
              "${cache_flags[@]}" \
              "${remote_flags[@]}" \
              --materialize_param_files \
              --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 \
              --repo_env=BAZEL_WINDOWS_SDK_EULA=1 \
              --platforms=@llvm//platforms:windows_x86_64_msvc \
              "${extra_flags[@]}" \
              //:windows_msvc_libcxx_behavior_static
            bazel \
              --bazelrc=.bazelrc \
              aquery \
              "${cache_flags[@]}" \
              "${remote_flags[@]}" \
              --include_param_files \
              --output=jsonproto \
              --output_file="${action_dir}/${cell}.json" \
              --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 \
              --repo_env=BAZEL_WINDOWS_SDK_EULA=1 \
              --platforms=@llvm//platforms:windows_x86_64_msvc \
              "${extra_flags[@]}" \
              //:windows_msvc_libcxx_behavior_static
            bazel \
              --bazelrc=.bazelrc \
              run \
              "${cache_flags[@]}" \
              "${remote_flags[@]}" \
              @llvm//tools:msvc_action_assert -- \
              -aquery "${action_dir}/${cell}.json" \
              -param-file-root "${PWD}" \
              -spec "${PWD}/windows_msvc_action_spec_${cell}.json"
          done

          bazel \
            --bazelrc=.bazelrc \
            aquery \
            "${cache_flags[@]}" \
            "${remote_flags[@]}" \
            --include_param_files \
            --output=jsonproto \
            --output_file="${action_dir}/runtime-optimization.json" \
            --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 \
            --repo_env=BAZEL_WINDOWS_SDK_EULA=1 \
            'deps(set(//:windows_msvc_runtime_optimization_optimized //:windows_msvc_runtime_optimization_debug))'
          bazel \
            --bazelrc=.bazelrc \
            run \
            "${cache_flags[@]}" \
            "${remote_flags[@]}" \
            @llvm//tools:msvc_action_assert -- \
            -aquery "${action_dir}/runtime-optimization.json" \
            -param-file-root "${PWD}" \
            -spec "${PWD}/windows_msvc_runtime_optimization_spec.json"

  llvm_version_analysis:
    strategy:
      fail-fast: false
      matrix:
        # Build one representative MSVC artifact from each supported LLVM line.
        llvm_version: ["21.1.8", "22.1.8", "23.1.0-rc1"]
    runs-on: ubuntu-latest
    name: Analyze LLVM ${{ matrix.llvm_version }}

    steps:
      - uses: actions/checkout@v6

      - name: Select LLVM ${{ matrix.llvm_version }}
        env:
          LLVM_VERSION: ${{ matrix.llvm_version }}
        shell: bash
        run: |
          for module_file in MODULE.bazel e2e/llvm_version_selection/MODULE.bazel; do
            if [[ "$(grep -c '^LLVM_VERSION = "[^"]*"$' "${module_file}")" != 1 ]]; then
              echo "Expected exactly one LLVM_VERSION assignment in ${module_file}" >&2
              exit 1
            fi
            perl -0pi -e 's/^LLVM_VERSION = "[^"]+"$/LLVM_VERSION = "$ENV{LLVM_VERSION}"/m' "${module_file}"
          done

      - name: Analyze LLVM ${{ matrix.llvm_version }} driver
        shell: bash
        run: |
          bazel build --nobuild //toolchain/bootstrap/stage1:llvm

      - name: Verify source-built LLVM ${{ matrix.llvm_version }} MSVC artifacts
        working-directory: e2e/rules_cc
        shell: bash
        run: |
          bazel \
            --bazelrc=.bazelrc \
            test \
            --config=remote \
            --lockfile_mode=off \
            --remote_header=x-buildbuddy-api-key=4jtaxdhxtyu4ylxdEwI7 \
            --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 \
            --repo_env=BAZEL_WINDOWS_SDK_EULA=1 \
            --@llvm//toolchain:bootstrap_stage=stage1_from_source \
            //:windows_msvc_artifacts_static_md_x86_64_test \
            //:windows_msvc_resource_directory_x86_64_test

      - name: Verify consumer prebuilt LLVM ${{ matrix.llvm_version }} selection
        env:
          LLVM_VERSION: ${{ matrix.llvm_version }}
        working-directory: e2e/llvm_version_selection
        shell: bash
        run: |
          bazel --bazelrc=/dev/null build --nobuild //:hello --lockfile_mode=off
          resource_dir="$(bazel --bazelrc=/dev/null cquery @llvm//:builtin_resource_dir --output=files --lockfile_mode=off)"
          expected_suffix="/lib/clang/${LLVM_VERSION%%.*}"
          if [[ "${resource_dir}" != *"${expected_suffix}" ]]; then
            echo "Expected LLVM ${LLVM_VERSION} resource directory ending in ${expected_suffix}, got ${resource_dir}" >&2
            exit 1
          fi

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        bazel_version: [8.x, last_rc]
    runs-on: ${{ matrix.os }}
    name: Test //tests/... with Bazel ${{ matrix.bazel_version }} on ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Mount bazel caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel-repo
          key: bazel-cache-tests-${{ matrix.os }}-${{ matrix.bazel_version }}-${{ hashFiles('**/BUILD.bazel', '**/*.bzl', 'MODULE.bazel') }}
          restore-keys: |
            bazel-cache-tests-${{ matrix.os }}-${{ matrix.bazel_version }}

      - name: bazel query kernel headers and test //tests/...
        env:
          USE_BAZEL_VERSION: ${{ matrix.bazel_version }}
        shell: bash
        run: |
          bazel \
            --bazelrc=$GITHUB_WORKSPACE/.github/workflows/ci.bazelrc \
            --bazelrc=.bazelrc \
            query \
            --remote_header=x-buildbuddy-api-key=4jtaxdhxtyu4ylxdEwI7 \
            --output=package \
            'deps(set(@kernel_headers//:3.6_kernel_headers @kernel_headers//:3.6_kernel_headers_directory @kernel_headers//:4.14_kernel_headers @kernel_headers//:4.14_kernel_headers_directory))'

          bazel \
            --bazelrc=$GITHUB_WORKSPACE/.github/workflows/ci.bazelrc \
