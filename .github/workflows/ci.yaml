name: CI
# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [main]
  pull_request:
    branches: [main, "cerisier/windows-msvc-*"]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  workflow_call:
concurrency:
  # Cancel previous actions from the same PR or branch except 'main' branch.
  # See https://docs.github.com/en/actions/using-jobs/using-concurrency and https://docs.github.com/en/actions/learn-github-actions/contexts for more info.
  group: concurrency-group::${{ github.workflow }}::${{ github.event.pull_request.number > 0 && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}${{ github.ref_name == 'main' && format('::{0}', github.run_id) || ''}}
  cancel-in-progress: ${{ github.ref_name != 'main' }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # only test on linux for now, macos is not ready.
        os: [ubuntu-latest, ubuntu-24.04-arm]
        bazel_version: [8.x, last_rc]
        folder:
          - "e2e/rules_cc"
          - "e2e/rules_foreign_cc"
          - "e2e/rules_rust"
          - "e2e/rules_rs"
          - "e2e/cross_compilation"
          - "examples/custom_targets"
        include:
          # Path mapping requires Bazel 9+.
          - bazel_version: last_rc
            folder: "e2e/rules_cc"
            extra_flags: "--experimental_output_paths=strip"
    runs-on: ${{ matrix.os }}

    # Configure a human readable name for each job
    name: Test ${{ matrix.folder }} with Bazel ${{ matrix.bazel_version }} on ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      # Cache build and external artifacts so that the next ci build is incremental.
      # Because github action caches cannot be updated after a build, we need to
      # store the contents of each build in a unique cache key, then fall back to loading
      # it on the next ci run. We use hashFiles(...) in the key and restore-keys- with
      # the prefix to load the most recent cache for the branch on a cache miss. You
      # should customize the contents of hashFiles to capture any bazel input sources,
      # although this doesn't need to be perfect. If none of the input sources change
      # then a cache hit will load an existing cache and bazel won't have to do any work.
      # In the case of a cache miss, you want the fallback cache to contain most of the
      # previously built artifacts to minimize build time. The more precise you are with
      # hashFiles sources the less work bazel will have to do.
      - name: Mount bazel caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel-repo
          key: bazel-cache-${{ matrix.os }}-${{ matrix.bazel_version }}-${{ matrix.folder }}-${{ hashFiles('**/BUILD.bazel', '**/*.bzl', 'MODULE.bazel') }}
          restore-keys: |
            bazel-cache-${{ matrix.os }}-${{ matrix.bazel_version }}-${{ matrix.folder }}

      - name: bazel test //...
        env:
          USE_BAZEL_VERSION: ${{ matrix.bazel_version }}
        working-directory: ${{ matrix.folder }}
        shell: bash
        run: |
          bazel \
            --bazelrc=$GITHUB_WORKSPACE/.github/workflows/ci.bazelrc \
            --bazelrc=.bazelrc \
            test \
            --remote_header=x-buildbuddy-api-key=4jtaxdhxtyu4ylxdEwI7 \
            ${{ matrix.extra_flags }} \
            //...

      - name: bazel coverage e2e (lcov)
        if: matrix.folder == 'e2e/rules_cc' && matrix.bazel_version == 'last_rc'
        env:
          USE_BAZEL_VERSION: ${{ matrix.bazel_version }}
        working-directory: ${{ matrix.folder }}
        shell: bash
        run: ./coverage_lcov_test.sh --remote_header=x-buildbuddy-api-key=4jtaxdhxtyu4ylxdEwI7

  test_windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bazel_version: latest
            compiler: mingw
            folder: e2e/rules_cc
          - os: windows-11-arm
            bazel_version: latest
            compiler: mingw
            folder: e2e/rules_cc
          - os: windows-latest
            bazel_version: latest
            compiler: default
            folder: e2e/cross_compilation
          - os: windows-11-arm
            bazel_version: latest
            compiler: default
            folder: e2e/cross_compilation
          - os: windows-latest
            bazel_version: latest
            compiler: msvc
            folder: e2e/rules_cc
            link_machine: X64
            machine: AMD64
            repo_cpu: amd64
            target_cpu: x86_64
          - os: windows-11-arm
            bazel_version: latest
            compiler: msvc
            folder: e2e/rules_cc
            link_machine: ARM64
            machine: ARM64
            repo_cpu: arm64
            target_cpu: aarch64
    runs-on: ${{ matrix.os }}

    # Configure a human readable name for each job
    name: Test ${{ matrix.folder }} with ${{ matrix.compiler }} on ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Build and register unpublished MSVC prebuilt
        if: matrix.compiler == 'msvc'
        env:
          USE_BAZEL_VERSION: ${{ matrix.bazel_version }}
        shell: bash
        run: |
          common_flags=(
            --config=remote
            --config=release
            --jobs=300
            --remote_header=x-buildbuddy-api-key=4jtaxdhxtyu4ylxdEwI7
            --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1
            --repo_env=BAZEL_WINDOWS_SDK_EULA=1
            --shell_executable=/bin/bash
          )
          target="//prebuilt/llvm:for_windows_${{ matrix.target_cpu }}_msvc"
          bazel build \
            "${common_flags[@]}" \
            --remote_download_toplevel \
            "${target}"
          archive="$(bazel cquery \
            "${common_flags[@]}" \
            --output=files \
            "${target}")"
          python .github/workflows/register-local-llvm-prebuilt.py \
            --archive "${archive}" \
            --index extensions/llvm_toolchain_minimal_index.json \
            --llvm-version-module MODULE.bazel \
            --module e2e/rules_cc/MODULE.bazel \
            --output-index e2e/rules_cc/llvm_toolchain_minimal_index.local.json \
            --target windows-${{ matrix.repo_cpu }}

      - name: bazel test //...
        if: matrix.compiler != 'msvc'
        id: bazel_test
        env:
          USE_BAZEL_VERSION: ${{ matrix.bazel_version }}
        working-directory: ${{ matrix.folder }}
        shell: bash
        run: |
          EXTRA_ARGS=""
          if [[ "${{ matrix.folder }}" == *"cross_compilation"* ]]; then
            EXTRA_ARGS="--//:test_glibc_versions=none"
          fi

          bazel \
            --bazelrc=$GITHUB_WORKSPACE/.github/workflows/ci.bazelrc \
            --bazelrc=.bazelrc \
            test \
            --repository_cache= \
            --repo_contents_cache= \
            --remote_header=x-buildbuddy-api-key=4jtaxdhxtyu4ylxdEwI7 \
            --jobs=100 \
            $EXTRA_ARGS \
            //...

      - name: Exercise unpublished MSVC prebuilt natively
        if: matrix.compiler == 'msvc'
        env:
          USE_BAZEL_VERSION: ${{ matrix.bazel_version }}
        working-directory: e2e/rules_cc
        shell: bash
        run: |
          common_flags=(
            --lockfile_mode=off
            --repository_cache=
            --repo_contents_cache=
            --jobs=50
            --remote_header=x-buildbuddy-api-key=4jtaxdhxtyu4ylxdEwI7
            --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1
            --repo_env=BAZEL_WINDOWS_SDK_EULA=1
            --extra_execution_platforms=@platforms//host:host,@llvm//platforms:windows_${{ matrix.target_cpu }}_msvc
            --platforms=@llvm//platforms:windows_${{ matrix.target_cpu }}_msvc
            --spawn_strategy=local
          )
          compiler_repo="@llvm-toolchain-minimal-windows-${{ matrix.repo_cpu }}"
          bazel --bazelrc=.bazelrc build \
            "${common_flags[@]}" \
            "${compiler_repo}//:bin/llvm.exe" \
            "${compiler_repo}//:bin/llvm-readobj.exe"
          output_base="$(bazel --bazelrc=.bazelrc info output_base)"
          compiler="${output_base}/$(bazel --bazelrc=.bazelrc cquery \
            "${common_flags[@]}" \
            --output=files \
            "${compiler_repo}//:bin/llvm.exe")"
          readobj="${output_base}/$(bazel --bazelrc=.bazelrc cquery \
            "${common_flags[@]}" \
            --output=files \
            "${compiler_repo}//:bin/llvm-readobj.exe")"
          sha256sum "${compiler}"
          "${compiler}" --version
          "${readobj}" \
            --file-headers \
            --coff-imports \
            "${compiler}" | tee "${RUNNER_TEMP}/llvm-readobj.txt"
          grep -F "IMAGE_FILE_MACHINE_${{ matrix.machine }}" \
            "${RUNNER_TEMP}/llvm-readobj.txt"
          if grep -Eiq 'MSVCP[0-9]+|VCRUNTIME[0-9]+' "${RUNNER_TEMP}/llvm-readobj.txt"; then
            echo "Prebuilt compiler unexpectedly depends on the MSVC redistributable" >&2
            exit 1
          fi

          bazel --bazelrc=.bazelrc aquery \
            "${common_flags[@]}" \
            --output=commands \
            'mnemonic("CppCompile", //:windows_msvc_libcxx_behavior_md)' \
            >"${RUNNER_TEMP}/msvc-compile-action.txt"
          grep -F "llvm-toolchain-minimal-windows-${{ matrix.repo_cpu }}" \
            "${RUNNER_TEMP}/msvc-compile-action.txt"
          grep -F "clang-cl.exe" "${RUNNER_TEMP}/msvc-compile-action.txt"
          grep -F "/MD" "${RUNNER_TEMP}/msvc-compile-action.txt"
          if grep -Fq "toolchain/stage" "${RUNNER_TEMP}/msvc-compile-action.txt"; then
            echo "MSVC consumer unexpectedly selected a source-built compiler" >&2
            exit 1
          fi
          bazel --bazelrc=.bazelrc aquery \
            "${common_flags[@]}" \
            --output=commands \
            'mnemonic("CppArchive", //:windows_msvc_libcxx_behavior_support)' \
            >"${RUNNER_TEMP}/msvc-archive-action.txt"
          grep -F "llvm-toolchain-minimal-windows-${{ matrix.repo_cpu }}" \
            "${RUNNER_TEMP}/msvc-archive-action.txt"
          grep -F "llvm-ar.exe" "${RUNNER_TEMP}/msvc-archive-action.txt"
          bazel --bazelrc=.bazelrc aquery \
            "${common_flags[@]}" \
            --output=commands \
            'mnemonic("CppLink", //:windows_msvc_libcxx_behavior_md)' \
            >"${RUNNER_TEMP}/msvc-link-action.txt"
          grep -F "llvm-toolchain-minimal-windows-${{ matrix.repo_cpu }}" \
            "${RUNNER_TEMP}/msvc-link-action.txt"
          grep -F "clang-cl.exe" "${RUNNER_TEMP}/msvc-link-action.txt"
          grep -F "lld-link.exe" "${RUNNER_TEMP}/msvc-link-action.txt"
          grep -F "/MACHINE:${{ matrix.link_machine }}" \
            "${RUNNER_TEMP}/msvc-link-action.txt"

          bazel --bazelrc=.bazelrc test \
            "${common_flags[@]}" \
            --strategy=TestRunner=local \
            //:windows_msvc_libcxx_behavior_md \
            //:windows_msvc_dll_behavior
          bazel --bazelrc=.bazelrc test \
            "${common_flags[@]}" \
            --features=-dynamic_link_msvcrt \
            --features=static_link_msvcrt \
            --strategy=TestRunner=local \
            //:windows_msvc_libcxx_behavior_mt

  # macOS: smoke build (//:main_default) plus the supported sanitizer e2e tests.
  test_macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
        bazel_version: [last_rc]
        folder:
          - "e2e/rules_cc"
          # - "e2e/rules_foreign_cc" TODO: Current tests only support linux
          # - "e2e/rules_rust" - Need a bazel nightly with https://github.com/bazelbuild/bazel/pull/28038
          # - "e2e/cross_compilation"
    runs-on: ${{ matrix.os }}

    # Configure a human readable name for each job
    name: Test smoke ${{ matrix.folder }} with Bazel ${{ matrix.bazel_version }} on ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: bazel build //:main_default
        id: bazel_test
        env:
          USE_BAZEL_VERSION: ${{ matrix.bazel_version }}
        working-directory: ${{ matrix.folder }}
        shell: bash
        run: |
          bazel \
            --bazelrc=.bazelrc \
            build \
            --remote_header=x-buildbuddy-api-key=4jtaxdhxtyu4ylxdEwI7 \
            //:main_default

      # ASan, UBSan and libFuzzer are fully supported on macOS: run their e2e
      # tests (they execute locally — no remote executor is configured for
      # macOS).
      # TSan and LSan build, link and load on macOS, but their runtime support
      # is a follow-up, so we only validate that their instrumented binaries
      # build (the runtime e2e tests stay Linux-only).
      - name: bazel test macOS sanitizers
        env:
          USE_BAZEL_VERSION: ${{ matrix.bazel_version }}
        working-directory: ${{ matrix.folder }}
        shell: bash
        run: |
          bazel \
            --bazelrc=.bazelrc \
            test \
            --remote_header=x-buildbuddy-api-key=4jtaxdhxtyu4ylxdEwI7 \
            //:asan_output_test \
            //:ubsan_output_test \
            //:fuzzer_output_test \
            //:fuzzer_asan_output_test \
            //:fuzzer_ubsan_output_test
          bazel \
            --bazelrc=.bazelrc \
            build \
            --remote_header=x-buildbuddy-api-key=4jtaxdhxtyu4ylxdEwI7 \
            //:tsan_fail \
            //:lsan_fail

      - name: bazel coverage macOS e2e (lcov)
        env:
          USE_BAZEL_VERSION: ${{ matrix.bazel_version }}
        working-directory: ${{ matrix.folder }}
        shell: bash
        run: ./coverage_lcov_test.sh --remote_header=x-buildbuddy-api-key=4jtaxdhxtyu4ylxdEwI7

  windows_msvc_layer1_hosts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bazel_version: last_rc
            target_cpu: x86_64
          - os: ubuntu-24.04-arm
            bazel_version: last_rc
            target_cpu: aarch64
    runs-on: ${{ matrix.os }}
    name: Windows MSVC Layer 1 on ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Cross-build representative MSVC behavior locally
        env:
          USE_BAZEL_VERSION: ${{ matrix.bazel_version }}
        working-directory: e2e/rules_cc
        shell: bash
        run: |
          cache_flags=()
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            cache_flags+=(--repository_cache= --repo_contents_cache=)
          fi
          bazel \
            --bazelrc=.bazelrc \
            build \
            "${cache_flags[@]}" \
            --jobs=50 \
            --remote_header=x-buildbuddy-api-key=4jtaxdhxtyu4ylxdEwI7 \
            --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 \
            --repo_env=BAZEL_WINDOWS_SDK_EULA=1 \
            --extra_execution_platforms=@platforms//host:host \
            --platforms=@llvm//platforms:windows_${{ matrix.target_cpu }}_msvc \
            --spawn_strategy=local \
            //:windows_msvc_libcxx_behavior_md \
            //:windows_msvc_dll_behavior
          bazel \
            --bazelrc=.bazelrc \
            build \
            "${cache_flags[@]}" \
            --jobs=50 \
            --remote_header=x-buildbuddy-api-key=4jtaxdhxtyu4ylxdEwI7 \
            --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 \
            --repo_env=BAZEL_WINDOWS_SDK_EULA=1 \
            --extra_execution_platforms=@platforms//host:host \
            --platforms=@llvm//platforms:windows_${{ matrix.target_cpu }}_msvc \
            --features=-dynamic_link_msvcrt \
            --features=static_link_msvcrt \
            --spawn_strategy=local \
            //:windows_msvc_libcxx_behavior_mt

      - name: Inspect representative MSVC artifacts
        if: runner.os == 'Linux'
        env:
          USE_BAZEL_VERSION: ${{ matrix.bazel_version }}
        working-directory: e2e/rules_cc
        shell: bash
        run: |
          bazel \
            --bazelrc=.bazelrc \
            test \
            --config=remote \
            --jobs=100 \
            --remote_header=x-buildbuddy-api-key=4jtaxdhxtyu4ylxdEwI7 \
            --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 \
            --repo_env=BAZEL_WINDOWS_SDK_EULA=1 \
            //:windows_msvc_artifacts_${{ matrix.target_cpu }}_test

      - name: Verify stable MSVC action protocols
        if: runner.os == 'Linux' && matrix.target_cpu == 'x86_64'
        env:
          USE_BAZEL_VERSION: ${{ matrix.bazel_version }}
        working-directory: e2e/rules_cc
        shell: bash
        run: |
          bash ./windows_msvc_action_test.sh \
            --config=remote \
            --jobs=100 \
            --remote_header=x-buildbuddy-api-key=4jtaxdhxtyu4ylxdEwI7

      - name: Verify unsupported MSVC configurations
        if: runner.os == 'Linux' && matrix.target_cpu == 'x86_64'
        env:
          USE_BAZEL_VERSION: ${{ matrix.bazel_version }}
        working-directory: e2e/rules_cc
        shell: bash
        run: |
          bash ./windows_msvc_analysis_test.sh \
            --config=remote \
            --jobs=100 \
            --remote_header=x-buildbuddy-api-key=4jtaxdhxtyu4ylxdEwI7

  llvm_version_analysis:
    strategy:
      fail-fast: false
      matrix:
        # Build one representative MSVC artifact from each supported LLVM line.
        llvm_version: ["21.1.8", "22.1.8", "23.1.0-rc1"]
    runs-on: ubuntu-latest
    name: Analyze LLVM ${{ matrix.llvm_version }}

    steps:
      - uses: actions/checkout@v6

      - name: Select LLVM ${{ matrix.llvm_version }}
        env:
          LLVM_VERSION: ${{ matrix.llvm_version }}
        shell: bash
        run: |
          for module_file in MODULE.bazel e2e/llvm_version_selection/MODULE.bazel; do
            if [[ "$(grep -c '^LLVM_VERSION = "[^"]*"$' "${module_file}")" != 1 ]]; then
              echo "Expected exactly one LLVM_VERSION assignment in ${module_file}" >&2
              exit 1
            fi
            perl -0pi -e 's/^LLVM_VERSION = "[^"]+"$/LLVM_VERSION = "$ENV{LLVM_VERSION}"/m' "${module_file}"
          done

      - name: Analyze LLVM ${{ matrix.llvm_version }} driver
        shell: bash
        run: |
          bazel build --nobuild //toolchain/bootstrap/stage1:llvm

      - name: Build source-built LLVM ${{ matrix.llvm_version }} MSVC behavior
        working-directory: e2e/rules_cc
        shell: bash
        run: |
          bazel \
            --bazelrc=.bazelrc \
            build \
            --config=remote \
            --lockfile_mode=off \
            --remote_header=x-buildbuddy-api-key=4jtaxdhxtyu4ylxdEwI7 \
            --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 \
            --repo_env=BAZEL_WINDOWS_SDK_EULA=1 \
            --@llvm//toolchain:bootstrap_stage=stage1_from_source \
            --platforms=@llvm//platforms:windows_x86_64_msvc \
            //:windows_msvc_libcxx_behavior_md

      - name: Verify consumer prebuilt LLVM ${{ matrix.llvm_version }} selection
        env:
          LLVM_VERSION: ${{ matrix.llvm_version }}
        working-directory: e2e/llvm_version_selection
        shell: bash
        run: |
          bazel --bazelrc=/dev/null build --nobuild //:hello --lockfile_mode=off
          resource_dir="$(bazel --bazelrc=/dev/null cquery @llvm//:builtin_resource_dir --output=files --lockfile_mode=off)"
          expected_suffix="/lib/clang/${LLVM_VERSION%%.*}"
          if [[ "${resource_dir}" != *"${expected_suffix}" ]]; then
            echo "Expected LLVM ${LLVM_VERSION} resource directory ending in ${expected_suffix}, got ${resource_dir}" >&2
            exit 1
          fi

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        bazel_version: [8.x, last_rc]
    runs-on: ${{ matrix.os }}
    name: Test //tests/... with Bazel ${{ matrix.bazel_version }} on ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Mount bazel caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel-repo
          key: bazel-cache-tests-${{ matrix.os }}-${{ matrix.bazel_version }}-${{ hashFiles('**/BUILD.bazel', '**/*.bzl', 'MODULE.bazel') }}
          restore-keys: |
            bazel-cache-tests-${{ matrix.os }}-${{ matrix.bazel_version }}

      - name: bazel query kernel headers and test //tests/...
        env:
          USE_BAZEL_VERSION: ${{ matrix.bazel_version }}
        shell: bash
        run: |
          bazel \
            --bazelrc=$GITHUB_WORKSPACE/.github/workflows/ci.bazelrc \
            --bazelrc=.bazelrc \
            query \
            --remote_header=x-buildbuddy-api-key=4jtaxdhxtyu4ylxdEwI7 \
            --output=package \
            'deps(set(@kernel_headers//:3.6_kernel_headers @kernel_headers//:3.6_kernel_headers_directory @kernel_headers//:4.14_kernel_headers @kernel_headers//:4.14_kernel_headers_directory))'

          bazel \
            --bazelrc=$GITHUB_WORKSPACE/.github/workflows/ci.bazelrc \
            --bazelrc=.bazelrc \
            test \
            --remote_header=x-buildbuddy-api-key=4jtaxdhxtyu4ylxdEwI7 \
            //tests/...

  docs:
    runs-on: macos-15-intel
    name: Verify public docs generation
    steps:
      - uses: actions/checkout@v6

      - name: Ensure Gazelle updated
        shell: bash
        run: |
          bazel \
            run \
            --config=remote \
            --remote_header=x-buildbuddy-api-key=4jtaxdhxtyu4ylxdEwI7 \
            //gazelle:gazelle -- -mode=diff

      - name: Build release docs
        run: |
          docs="$(mktemp -d)"
          targets="$(mktemp)"
          bash ./.github/workflows/build_public_starlark_docs.sh "$targets" "$docs"

  buildifier:
    runs-on: ubuntu-latest
    name: Verify buildifier formatting
    steps:
      - uses: actions/checkout@v6
      - name: Verify buildifier formatting
        shell: bash
        run: |
          bazel \
            run \
            --remote_header=x-buildbuddy-api-key=4jtaxdhxtyu4ylxdEwI7 \
            //internal_tools:buildifier.check
